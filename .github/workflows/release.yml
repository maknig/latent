name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Tag name on releases, short commit for manual runs.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      # Matches LSMinimumSystemVersion in apps/desktop/macos/Info.plist (ignored on other OSes).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ver="${VERSION#v}"
          case "$ver" in [0-9]*) ;; *) ver=0.0.0 ;; esac
          scripts/bundle-macos.sh "$ver"
          mkdir dist
          ditto -c -k --keepParent target/release/Latent.app "dist/latent-$VERSION-${{ matrix.name }}.zip"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p latent
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive target/release/latent.exe "dist/latent-$env:VERSION-${{ matrix.name }}.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p latent
          pkg="latent-$VERSION-${{ matrix.name }}"
          mkdir -p "stage/$pkg" dist
          cp target/release/latent apps/desktop/assets/latent.desktop "stage/$pkg/"
          cp apps/desktop/assets/icon.png "stage/$pkg/latent.png"
          tar czf "dist/$pkg.tar.gz" -C stage "$pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: latent-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            macOS (Apple Silicon only): the app is not notarized. Open it the first time with right-click > Open, or run `xattr -dr com.apple.quarantine Latent.app`.
            Windows: SmartScreen may warn about an unknown publisher; choose "More info" > "Run anyway".
            Linux: needs GTK 3 and OpenGL (or Wayland/X11) libraries from the distribution.
