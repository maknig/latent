[workspace]
resolver = "2"
members = ["crates/schema", "crates/data", "crates/engine", "crates/ui", "apps/desktop"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1"
thiserror = "1"
